# Netlify configuration for The Concierge Gynecologist
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# Plain static site — no build step. Every page is a real file in its own
# folder (/offerings/index.html, /care-model/index.html, ...), so no SPA
# fallback redirect is needed. Unknown URLs get /404.html.

[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# ── Caching: images and videos are treated as immutable (add new files
# rather than overwrite existing ones), so browsers and the CDN keep them
# for a year.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS change between deploys without renamed files — always revalidate.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "upgrade-insecure-requests"
